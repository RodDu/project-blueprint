name: Blueprint CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate registry.json
        run: |
          if [ -f scripts/registry.json ]; then
            python -c "import json; json.load(open('scripts/registry.json'))"
            echo "Registry JSON is valid."
          fi

  test-python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check Syntax (Discover & Install)
        run: |
          python -m py_compile scripts/discover.py
          python -m py_compile scripts/install.py
